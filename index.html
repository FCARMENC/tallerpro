<title>Expert · Gestión de taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&display=swap" />
<style>
  html, body { background: #15171A; margin: 0; color: #F3F1EC; font-family: 'Inter', -apple-system, sans-serif; }

  #boot-status {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    background:
      radial-gradient(60% 50% at 50% 40%, rgba(255,106,26,0.10), transparent 70%),
      #15171A;
    animation: bootFadeIn 0.3s ease-out both;
  }
  #boot-status.boot-hide { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }

  .boot-mark {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(145deg, #23262B, #1A1D21);
    border: 1px solid #31363C;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px -8px rgba(255,106,26,0.35), 0 1px 2px rgba(0,0,0,0.4);
    animation: bootPulse 1.8s ease-in-out infinite;
  }
  .boot-mark svg { width: 30px; height: 30px; }

  .boot-brand {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    letter-spacing: 0.14em;
    color: #F3F1EC;
    text-transform: uppercase;
  }
  .boot-brand span { color: #FF6A1A; }

  .boot-sub {
    font-size: 13px; color: #6C7278; letter-spacing: 0.02em;
    margin-top: -14px;
  }

  .boot-bar {
    width: 140px; height: 3px; border-radius: 999px;
    background: #262A2F; overflow: hidden;
  }
  .boot-bar-fill {
    height: 100%; width: 40%; border-radius: 999px;
    background: linear-gradient(90deg, #FF6A1A, #FFB380);
    animation: bootSlide 1.1s cubic-bezier(0.4,0,0.2,1) infinite;
  }

  @keyframes bootFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bootPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes bootSlide {
    0% { transform: translateX(-140px); }
    100% { transform: translateX(340px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .boot-mark, .boot-bar-fill { animation: none; }
  }

  #boot-error {
    display:none; padding: 24px; white-space: pre-wrap; font-family: ui-monospace, monospace;
    font-size: 13px; line-height: 1.6; color: #F0546B; background: #1D2024;
    margin: 16px; border-radius: 12px; border: 1px solid #31363C;
  }
</style>
</head>
<body>
<div id="boot-status">
  <div class="boot-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
    </svg>
  </div>
  <div class="boot-brand">EXPERT<span>.</span></div>
  <div class="boot-sub">Gestión de taller</div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
</div>
<div id="boot-error"></div>
<div id="root"></div>

<script>
  function showBootError(msg) {
    var el = document.getElementById('boot-error');
    var status = document.getElementById('boot-status');
    if (status) status.style.display = 'none';
    el.style.display = 'block';
    el.textContent = msg;
  }
  window.addEventListener('error', function (e) {
    var target = e.target;
    if (target && target.tagName === 'SCRIPT' && target.src) {
      showBootError('No se pudo cargar un script externo:\n' + target.src + '\n\nRevisa tu conexión a internet o bloqueadores de anuncios.');
    } else if (e.error) {
      showBootError('Error de JavaScript:\n' + (e.error.stack || e.message));
    }
  }, true);
</script>
