<script>
  // Aplica el tema guardado (o el del sistema) antes del primer pintado, para evitar
  // un parpadeo del tema incorrecto mientras cargan React y el resto de librer\u00EDas.
  (function () {
    try {
      var raw = window.localStorage.getItem("expertTaller.theme");
      var mode = raw ? JSON.parse(raw) : "system";
      var dark = mode === "dark" || (mode !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

  :root {
    --boot-bg: #15171A;
    --boot-text: #F3F1EC;
    --boot-muted: #6C7278;
    --boot-bar-bg: #262A2F;
    --boot-error-bg: #1D2024;
    --boot-error-border: #31363C;
    --boot-error-text: #F0546B;
  }
  html[data-theme="light"] {
    --boot-bg: #F6F3EE;
    --boot-text: #221D17;
    --boot-muted: #8B8272;
    --boot-bar-bg: #EFEAE0;
    --boot-error-bg: #FFFFFF;
    --boot-error-border: #E2DACB;
    --boot-error-text: #CC2E51;
  }
  html, body { background: var(--boot-bg); margin: 0; color: var(--boot-text); font-family: 'Inter', -apple-system, sans-serif; }

  #boot-status {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    background:
      radial-gradient(60% 50% at 50% 40%, rgba(255,106,26,0.10), transparent 70%),
      var(--boot-bg);
    animation: bootFadeIn 0.3s ease-out both;
  }
  #boot-status.boot-hide { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }

  .boot-mark {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(145deg, #23262B, #1A1D21);
    border: 1px solid #31363C;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px -8px rgba(255,106,26,0.35), 0 1px 2px rgba(0,0,0,0.4);
    animation: bootPulse 1.8s ease-in-out infinite;
  }
  .boot-mark svg { width: 30px; height: 30px; }

  .boot-brand {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    letter-spacing: 0.14em;
    color: var(--boot-text);
    text-transform: uppercase;
  }
  .boot-brand span { color: #FF6A1A; }

  .boot-sub {
    font-size: 13px; color: var(--boot-muted); letter-spacing: 0.02em;
    margin-top: -14px;
  }

  .boot-bar {
    width: 140px; height: 3px; border-radius: 999px;
    background: var(--boot-bar-bg); overflow: hidden;
  }
  .boot-bar-fill {
    height: 100%; width: 40%; border-radius: 999px;
    background: linear-gradient(90deg, #FF6A1A, #FFB380);
    animation: bootSlide 1.1s cubic-bezier(0.4,0,0.2,1) infinite;
  }

  @keyframes bootFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bootPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes bootSlide {
    0% { transform: translateX(-140px); }
    100% { transform: translateX(340px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .boot-mark, .boot-bar-fill { animation: none; }
  }

  #boot-error {
    display:none; padding: 24px; white-space: pre-wrap; font-family: ui-monospace, monospace;
    font-size: 13px; line-height: 1.6; color: var(--boot-error-text); background: var(--boot-error-bg);
    margin: 16px; border-radius: 12px; border: 1px solid var(--boot-error-border);
  }
</style>
<script>
  // Instalación como app (PWA): guarda el evento de instalación de Chrome/Android para
  // poder dispararlo luego desde el botón "Instalar" en Ajustes.
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__expertInstallPrompt = e;
    window.dispatchEvent(new Event("expertTaller:installAvailable"));
  });
  window.addEventListener("appinstalled", function () {
    window.__expertInstallPrompt = null;
  });
  // Registra el service worker que cachea la app (index.html + librerías) para que puedas
  // abrir Expert Taller aunque no tengas internet en ese momento. Se registra siempre, no solo
  // cuando activas los avisos push, y se hace en segundo plano para no retrasar la carga.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) {
        console.warn("No se pudo registrar el service worker (modo offline no disponible):", err);
      });
    });
  }
</script>

<script>
  function showBootError(msg) {
    var el = document.getElementById('boot-error');
    var status = document.getElementById('boot-status');
    if (status) status.style.display = 'none';
    el.style.display = 'block';
    el.textContent = msg;
  }
  window.addEventListener('error', function (e) {
    var target = e.target;
    if (target && target.tagName === 'SCRIPT' && target.src) {
      showBootError('No se pudo cargar un script externo:\n' + target.src + '\n\nRevisa tu conexión a internet o bloqueadores de anuncios.');
    } else if (e.error) {
      showBootError('Error de JavaScript:\n' + (e.error.stack || e.message));
    }
  }, true);
</script>

function hexToRgbObj(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
    if (!m)
        return null;
    return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}
const clampByte = (n) => Math.max(0, Math.min(255, Math.round(n)));
function accentRgba(hex, alpha) {
    const rgb = hexToRgbObj(hex);
    if (!rgb)
        return null;
    return `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
}
// Mezcla un color hacia blanco (percent > 0) o hacia negro (percent < 0), útil para derivar
// una variante clara/oscura de "accentText" a partir del color de acento elegido.
function shadeHex(hex, percent) {
    const rgb = hexToRgbObj(hex);
    if (!rgb)
        return hex;
    const target = percent < 0 ? 0 : 255;
    const p = Math.abs(percent);
    const toHex = (n) => clampByte(n).toString(16).padStart(2, "0");
    const r = (target - rgb.r) * p + rgb.r;
    const g = (target - rgb.g) * p + rgb.g;
    const b = (target - rgb.b) * p + rgb.b;
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
// Aplica el color de acento personalizado del taller (si tiene uno válido) sobre la paleta C ya
// resuelta para el tema claro/oscuro actual. Se llama en cada render de App(), igual que el
// cambio de tema, así todos los componentes toman el color nuevo en el mismo repintado.
function applyAccentColor(hex, resolvedTheme) {
    if (!hex || !hexToRgbObj(hex))
        return;
    C.accent = hex;
    C.accentSoft = accentRgba(hex, 0.14);
    C.accentText = resolvedTheme === "light" ? shadeHex(hex, -0.32) : shadeHex(hex, 0.35);
